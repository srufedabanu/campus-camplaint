<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Complaint System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(rgba(20, 30, 48, 0.75), rgba(36, 59, 85, 0.75)),
                url("https://images.unsplash.com/photo-1562774053-701939374585")
                center/cover no-repeat;
        }

        .container {
            width: 450px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #243b55;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #243b55;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #243b55;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #141e30;
        }

        /* Notification */
        .notification {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            text-align: center;
            font-weight: bold;
        }

        .complaint-id {
            margin-top: 8px;
            font-size: 18px;
            color: #0b6623;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Campus Complaint System</h1>

    <p class="subtitle">
        Submit your complaint and receive a registration notification
    </p>

    <form id="complaintForm">

        <label for="name">Student Name</label>
        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
        >

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label for="complaint">Complaint</label>
        <textarea
            id="complaint"
            placeholder="Enter your complaint"
            required
        ></textarea>

        <button type="submit">
            Submit Complaint
        </button>

    </form>

    <!-- Submission Notification -->
    <div id="notification" class="notification">

        Complaint submitted successfully!

        <div class="complaint-id">
            Complaint ID: <span id="complaintId"></span>
        </div>

        <div>
            Your complaint has been registered.
        </div>

    </div>

</div>


<script>

    document
        .getElementById("complaintForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            // Get student details
            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const complaint = document.getElementById("complaint").value;

            // Generate complaint ID
            const complaintId =
                "CMP" + Math.floor(1000 + Math.random() * 9000);

            // Display complaint ID
            document.getElementById("complaintId").textContent =
                complaintId;

            // Show notification
            document.getElementById("notification").style.display =
                "block";

            // Clear form
            document.getElementById("complaintForm").reset();

            console.log("Complaint Registered");
            console.log("Complaint ID:", complaintId);
            console.log("Student:", name);
            console.log("Email:", email);
            console.log("Complaint:", complaint);

        });

</script>

</body>
</html>
